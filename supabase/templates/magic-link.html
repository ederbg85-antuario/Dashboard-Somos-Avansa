<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entra a avansa</title>
  </head>
  <body style="margin:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#0d1117">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:28px 12px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(15,45,61,.12)">
            <tr>
              <td style="background:#0f2d3d;padding:28px 34px">
                <img src="https://www.somosavansa.com/brand/avansa-logo-on-dark.svg" width="170" alt="avansa" style="display:block;border:0;max-width:100%;height:auto">
              </td>
            </tr>
            <tr>
              <td style="padding:36px 34px 8px">
                <p style="margin:0 0 10px;color:#ff4d6d;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Acceso al equipo</p>
                <h1 style="margin:0;color:#0f2d3d;font-size:30px;line-height:1.15">Entra al sistema sin contraseña.</h1>
                <p style="margin:18px 0 0;color:#6b7785;font-size:16px;line-height:1.65">
                  Usa este enlace personal para iniciar sesión en el dashboard de avansa.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 34px 12px">
                <a href="{{ .SiteURL }}/auth/confirm?next=/&amp;token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#ff4d6d;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;padding:15px 28px;border-radius:999px">
                  Entrar a avansa
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 34px 36px">
                <p style="margin:0;color:#9aa5b1;font-size:12px;line-height:1.55;text-align:center">
                  Este enlace es personal y sólo puede usarse una vez. Si no lo solicitaste, puedes ignorar el correo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
